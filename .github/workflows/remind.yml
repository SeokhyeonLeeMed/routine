name: routine-reminder
# 15분마다 깨어나 사이트 설정의 알림 시각(기본 08:00 '오늘 할 것', 21:30 '남은 것')이 지났고 아직 안 보낸 칸이 있으면 보낸다.
# GitHub 예약 실행은 몇 분~수십 분 늦을 수 있다. 정한 시각부터 150분 안에만 보낸다(core.js dueSlots).
# secrets: SUPABASE_URL, SUPABASE_ANON, STORE_EMAIL, STORE_PASSWORD, STORE_UID, VAPID_JWK (_tools/ghsecret/set.cjs로 넣는다)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "지금 바로 보내기 (plan 또는 left, 비우면 시각대로)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: reminder
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            core.js
          sparse-checkout-cone-mode: false
      - run: node .github/push.mjs
        env:
          FORCE: ${{ github.event.inputs.force }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
          STORE_EMAIL: ${{ secrets.STORE_EMAIL }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          STORE_UID: ${{ secrets.STORE_UID }}
          VAPID_JWK: ${{ secrets.VAPID_JWK }}
